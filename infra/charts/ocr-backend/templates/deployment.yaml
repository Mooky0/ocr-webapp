apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ocr-backend
  template:
    metadata:
      labels:
        app: ocr-backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        env:
        - name: DATABASE_URL
          value: {{ .Values.env.dbUrl | quote }}
        - name: MINIO_URL
          value: {{ .Values.env.minioUrl | quote }}
        - name: MINIO_ROOT_USER
          value: {{ .Values.env.minioRootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.env.minioRootPassword | quote }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.env.kafkaBootstrapServers | quote }}
        - name: SENDER_EMAIL
          valueFrom:
            secretKeyRef:
              name: gmail-secret
              key: SENDER_EMAIL
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: gmail-secret
              key: PASSWORD